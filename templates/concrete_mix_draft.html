{% extends "base.html" %}
{% set active = "add" %}
{% block title %}Добавление — ЮГ БЕТОН{% endblock %}
{% block body_class %}draft-page{% endblock %}

{% block content %}
<section class="screen">
    <header class="topbar">
        {% include "partials/logo.html" %}
    </header>
    <div class="divider"></div>

    +
    <form class="draft-form" autocomplete="off">
        <div class="field-group">
            <label for="concrete_mix_name">МАРКА</label>
            <input id="concrete_mix_name"
                name="concrete_mix_name"
                type="text"
                placeholder="Марка бетона">
        </div>

        <div class="field-group">
            <label for="concrete_mix_description">ОПИСАНИЕ</label>
            <textarea id="concrete_mix_description"
                      name="concrete_mix_description"
                      rows="4"
                      placeholder="Описание">{{ concrete_mix.concrete_mix_description }}</textarea>
        </div>

        <div class="field-group">
            <label for="concrete_mix_price">ЦЕНА</label>
            <input id="concrete_mix_price"
                   name="concrete_mix_price"
                   type="number"
                   min="0"
                   value="{{ concrete_mix.concrete_mix_price }}"
                   placeholder="Цена за м³">
        </div>

        <div class="field-group">
            <label for="concrete_mix_strength">ПРОЧНОСТЬ</label>
            <input id="concrete_mix_strength"
                   name="concrete_mix_strength"
                   type="number"
                   min="0"
                   step="0.1"
                   value="{{ concrete_mix.concrete_mix_strength }}"
                   placeholder="МПа">
        </div>

        <div class="field-group">
            <label for="concrete_mix_image_key">ФОТО</label>
            <input id="concrete_mix_image_key"
                   name="concrete_mix_image_key"
                   type="text"
                   placeholder="m100.jpg">
        </div>

        <div class="field-group">
            <label for="concrete_mix_video_key">ВИДЕО</label>
            <input id="concrete_mix_video_key"
                   name="concrete_mix_video_key"
                   type="text"
                   placeholder="m100.mp4">
        </div>

        <button class="save-button" type="button" disabled>СОХРАНИТЬ</button>
    </form>

    {% include "partials/bottom_nav.html" %}
</section>
{% endblock %}
